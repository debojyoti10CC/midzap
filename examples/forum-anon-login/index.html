<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Candid — Internal Feedback Forum (MidnightZap demo)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; color: #1a1a1a; }
      button { background: #16213e; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 15px; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: default; }
      textarea { width: 100%; min-height: 80px; border-radius: 8px; border: 1px solid #ccc; padding: 10px; font-family: inherit; }
      .card { border: 1px solid #e2e2e2; border-radius: 12px; padding: 20px; margin-top: 16px; }
      .midnightzap-verified-badge { color: #0a7f43; font-weight: 600; }
      .midnightzap-error { color: #b3261e; font-size: 14px; }
      .post { border-top: 1px solid #eee; padding: 10px 0; }
      .post small { color: #888; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

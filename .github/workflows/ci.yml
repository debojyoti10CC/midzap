name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build SDK + CLI
        run: npm run build:sdk && npm run build:cli

      - name: Typecheck
        run: npm run typecheck

      - name: Predicate smoke test
        run: node scripts/smoke-test.mjs

      - name: Build example integrations
        run: npm run build:examples

      - name: CLI end-to-end (convert a plain app, build the result)
        run: node scripts/cli-e2e.mjs
